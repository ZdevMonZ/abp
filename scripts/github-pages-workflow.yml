# ─────────────────────────────────────────────────────────────────────────────
# ★ 지금은 쓰지 않는 파일입니다 (보관용)
#
# 지금 이 프로젝트는 `npm run deploy` 로 손수 올리는 방식(gh-pages 브랜치)을 씁니다.
# "push 하면 GitHub 이 알아서 빌드·배포" 하는 완전 자동 방식으로 바꾸고 싶으면:
#
#   1) github.com/settings/tokens 에서 쓰던 토큰에 `workflow` 권한을 체크하고 저장
#   2) 이 파일을 `.github/workflows/deploy.yml` 로 옮긴 뒤 커밋·푸시
#   3) 저장소 Settings → Pages → Source 를 `GitHub Actions` 로 변경
#
# (권한 없이 푸시하면 GitHub 이 거부합니다 — 그래서 지금은 여기 보관해 둡니다)
# ─────────────────────────────────────────────────────────────────────────────

# GitHub Pages 자동 배포
# ---------------------------------------------------------------------------
# main 브랜치에 푸시할 때마다 GitHub 이 알아서 사이트를 만들어 올립니다.
# 내 컴퓨터에서 따로 할 일은 없습니다. (처음 한 번만 저장소 설정에서
#  Settings → Pages → Source 를 "GitHub Actions" 로 바꿔 주세요)
#
# 주소: https://<계정>.github.io/abp/
# 저장소 이름을 바꾸면 아래 BASE_PATH 의 /abp 도 같이 바꿔야 합니다.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 저장소 Actions 탭에서 손으로도 실행할 수 있게 합니다
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치지 않도록 한 번에 하나만 돌립니다
concurrency:
  group: pages
  cancel-in-progress: true

env:
  # 주소 뒤에 붙는 저장소 이름 (next.config.ts 와 src/image-loader.ts 가 씁니다)
  NEXT_PUBLIC_BASE_PATH: /abp

jobs:
  build:
    name: 사이트 만들기
    runs-on: ubuntu-latest
    steps:
      - name: 코드 받기
        uses: actions/checkout@v4

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 라이브러리 설치
        run: npm ci

      - name: 정적 사이트로 빌드 (out/ 폴더 생성)
        run: npm run build

      # GitHub Pages 는 이름이 _ 로 시작하는 폴더를 무시합니다.
      # Next.js 결과물이 _next/ 라서 이 파일이 없으면 화면이 깨집니다.
      - name: .nojekyll 추가
        run: touch out/.nojekyll

      - name: Pages 설정 읽기
        uses: actions/configure-pages@v5

      - name: 결과물 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: 사이트 올리기
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
